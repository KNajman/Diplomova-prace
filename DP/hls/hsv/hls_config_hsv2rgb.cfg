# Vitis HLS 2025.2 (unified flow) - převod barev, varianta hsv2rgb (top hls_hsv2rgb)
# Cesty jsou relativní k umístění tohoto souboru. Spouští se skriptem ../scripts/run_hls.sh.
# Úplný test 2^24 vstupů: TB_HSV_FULL=1 bash run_hls.sh ../hsv/hls_config_hsv2rgb.cfg csim
part=xck26-sfvc784-2LV-c

[hls]
flow_target=vivado
clock=5ns
syn.top=hls_hsv2rgb
syn.file=hls_hsv.cpp
syn.cflags=-I../common -I../../model/lib_imgproc -I../../model/lib_imgproc/template -I../../model/generated
# Bez auto-rewind: u rewind smyčky s latencí > 2 zůstává ocas řádku (i s TLAST) v jádře, dokud nepřijde první pixel
# dalšího řádku, a mezera mezi snímky se v jádře ztratí (S2MM hlásí SOFLateErr). Cena: ~5 taktů mezi řádky.
syn.compile.enable_auto_rewind=0

tb.file=tb_hsv.cpp
tb.file=../../model/lib_imgproc/imgproc/csc.c
tb.file=../../model/lib_imgproc/imgproc/filter.c
tb.file=../../model/lib_imgproc/imgproc/histogram.c
tb.file=../../model/lib_imgproc/imgproc/hsv.c
tb.file=../../model/lib_imgproc/imgproc/image.c
tb.file=../../model/lib_imgproc/imgproc/median.c
tb.file=../../model/lib_imgproc/imgproc/threshold.c
tb.cflags=-I../common -I../../model/lib_imgproc -I../../model/lib_imgproc/template -I../../model/generated

csim.clean=1
cosim.rtl=vhdl
vivado.rtl=vhdl

package.output.format=ip_catalog
package.output.syn=false
package.ip.name=hls_hsv2rgb
package.ip.version=1.0
